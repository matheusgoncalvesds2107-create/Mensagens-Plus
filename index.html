
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Mensagens Plus - Parceira Vem Comigo Deus">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">
<title>Mensagens Plus</title>

<style>
:root {
  --green:#008f68;
  --light:#ffffff;
  --ink:#111b21;
  --muted:#667781;
  --line:#edf0f1;
  --chat:#111821;
}

* { box-sizing:border-box; }

html,body {
  margin:0;
  width:100%;
  height:100%;
  font-family:system-ui,Arial,sans-serif;
}

body {
  background:#f5f6f7;
  color:var(--ink);
}

button,input {
  font:inherit;
}

button { cursor:pointer; }
.oculto { display:none!important; }

header {
  display:none;
}

.container {
  max-width:1350px;
  margin:auto;
  height:100dvh;
  background:white;
}

.app {
  display:grid;
  grid-template-columns:370px minmax(0,1fr);
  height:100%;
}

aside {
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:white;
  border-right:1px solid #ddd;
}

.topo-contatos {
  padding:25px 17px 6px;
}

.topo-linha {
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.topo-linha h2 {
  margin:0;
  color:#087b5d;
  font-size:27px;
  letter-spacing:-1px;
}

.topo-icone {
  background:#e8f5ef;
  color:#087b5d;
  border:0;
  width:40px;
  height:40px;
  border-radius:50%;
  font-size:22px;
}

.identidade {
  font-size:12px;
  color:#667781;
  margin-top:8px;
  overflow-wrap:anywhere;
}

.pesquisa {
  margin:16px 15px 9px;
  display:flex;
  gap:10px;
  align-items:center;
  background:#f0f2f5;
  border-radius:30px;
  padding:0 15px;
}

.pesquisa span {
  color:#667781;
  font-size:20px;
}

.pesquisa input {
  border:none;
  background:transparent;
  padding:15px 0;
  outline:none;
  width:100%;
  min-width:0;
  font-size:15px;
}

.filtros {
  display:flex;
  gap:8px;
  padding:12px 15px 16px;
}

.filtro {
  border:1px solid #dde3e5;
  background:white;
  color:#45545b;
  padding:8px 17px;
  border-radius:25px;
  font-size:13px;
}

.filtro.ativo {
  background:#d9f3e3;
  border-color:#d9f3e3;
  color:#067650;
  font-weight:700;
}

#contatos {
  flex:1;
  min-height:0;
  overflow-y:auto;
}

.contato {
  display:flex;
  gap:13px;
  align-items:center;
  padding:14px 17px;
  min-height:82px;
  background:#fff;
  cursor:pointer;
  border-bottom:1px solid #f1f3f4;
}

.contato:hover,
.contato:focus {
  background:#f6f7f8;
}

.avatar {
  width:55px;
  height:55px;
  border-radius:50%;
  flex-shrink:0;
  background:linear-gradient(145deg,#27c495,#08765a);
  color:white;
  font-size:19px;
  display:grid;
  place-items:center;
  font-weight:700;
  overflow:hidden;
}

.avatar img {
  width:100%;
  height:100%;
  object-fit:cover;
}

.contato-info {
  flex:1;
  min-width:0;
}

.contato-topo {
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.contato-nome {
  font-size:16px;
  font-weight:650;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.contato-hora {
  color:#84929a;
  font-size:11px;
}

.contato-sub {
  font-size:13px;
  margin-top:6px;
  color:#77858d;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.navegacao {
  display:flex;
  justify-content:space-around;
  align-items:center;
  height:72px;
  min-height:72px;
  background:#fff;
  border-top:1px solid #e8ecee;
}

.nav-item {
  border:0;
  background:transparent;
  color:#75838a;
  display:flex;
  flex-direction:column;
  align-items:center;
  gap:4px;
  padding:7px 18px;
  font-size:11px;
}

.nav-item .simbolo {
  font-size:24px;
}

.nav-item.ativo {
  color:#087b5d;
  font-weight:750;
}

/* CONVERSA */

.conversa {
  min-width:0;
  min-height:0;
  display:flex;
  flex-direction:column;
  background:#111821;
}

.barra-chat {
  height:66px;
  min-height:66px;
  padding:0 14px;
  display:flex;
  align-items:center;
  gap:12px;
  background:#202c33;
  color:white;
}

#voltar-chat {
  background:none;
  border:0;
  color:white;
  font-size:26px;
  padding:7px;
}

.avatar-chat {
  width:42px;
  height:42px;
  border-radius:50%;
  background:#14765c;
  color:white;
  display:grid;
  place-items:center;
  font-weight:700;
}

.dados-chat {
  flex:1;
  min-width:0;
}

.titulo-chat {
  font-size:16px;
  font-weight:650;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.info-chat {
  color:#b4c0c5;
  font-size:12px;
  margin-top:4px;
}

.mensagens {
  flex:1;
  min-height:0;
  overflow-y:auto;
  padding:20px 6%;
  display:flex;
  flex-direction:column;
  gap:8px;
  background:
    repeating-linear-gradient(
      145deg,
      transparent 0px,
      transparent 65px,
      #ffffff06 66px,
      transparent 70px
    ),
    linear-gradient(155deg,#19232c,#111821 60%,#202b35);
}

.bolha {
  max-width:78%;
  align-self:flex-start;
  padding:10px 13px;
  border-radius:5px 13px 13px 13px;
  background:#34414a;
  color:white;
  font-size:14px;
  line-height:1.5;
  white-space:pre-wrap;
  overflow-wrap:anywhere;
  box-shadow:0 2px 4px #0002;
}

.bolha.minha {
  align-self:flex-end;
  background:#14664f;
  border-radius:13px 5px 13px 13px;
}

.enviar {
  display:flex;
  align-items:center;
  gap:9px;
  padding:10px;
  background:#202c33;
}

.enviar input {
  min-width:0;
  flex:1;
  border:0;
  outline:0;
  border-radius:30px;
  padding:14px 17px;
  font-size:16px;
  background:#34414a;
  color:white;
}

.enviar input::placeholder {
  color:#bdc8cf;
}

.enviar button {
  width:47px;
  height:47px;
  border:0;
  border-radius:50%;
  background:#00a884;
  color:white;
  flex-shrink:0;
  font-size:23px;
}

.enviar button:disabled {
  opacity:.4;
}

#aviso-chat {
  color:#ffe0a1;
  font-size:12px;
  background:#202c33;
}

/* LOGIN */

.login {
  max-width:420px;
  margin:8vh auto;
  padding:30px 23px;
  border-radius:20px;
  background:#fff;
  box-shadow:0 6px 35px #0001;
  text-align:center;
}

.login-logo {
  background:#00a884;
  color:white;
  width:75px;
  height:75px;
  margin:0 auto 20px;
  border-radius:22px;
  display:grid;
  place-items:center;
  font-size:29px;
  font-weight:900;
}

.login h2 { font-size:23px; }
.login p { color:#6b7981; }

.login input {
  display:block;
  width:100%;
  margin:12px 0;
  padding:15px;
  border:1px solid #d5dddf;
  border-radius:12px;
  outline:0;
}

.login input:focus { border-color:#00a884; }

.botoes-login {
  display:flex;
  gap:9px;
}

.login button {
  flex:1;
  border:0;
  border-radius:12px;
  padding:13px;
  font-weight:700;
}

#entrar {
  background:#00a884;
  color:white;
}

#cadastrar {
  background:#e7f4ed;
  color:#067550;
}

#google {
  width:100%;
  margin-top:12px;
  background:#eef1f2;
  color:#243138;
}

#aviso-login {
  color:#b54c30;
  font-size:13px;
  margin-top:10px;
}

@media(max-width:700px) {
  .container {
    height:100dvh;
  }

  .app {
    display:block;
    height:100%;
  }

  aside {
    height:100%;
    border:0;
  }

  .conversa {
    display:none;
    height:100%;
  }

  .app.chat-aberto aside {
    display:none;
  }

  .app.chat-aberto .conversa {
    display:flex;
  }

  .mensagens {
    padding:16px 11px;
  }

  .bolha { max-width:88%; }

  .enviar {
    padding-bottom:max(10px,env(safe-area-inset-bottom));
  }

  .login {
    margin:24px 15px;
    max-height:calc(100dvh - 48px);
    overflow-y:auto;
  }
}
</style>
</head>

<body>

<header>
  <h1>Mensagens Plus</h1>
  <button id="sair" class="oculto">Sair</button>
</header>

<div class="container">

  <!-- LOGIN -->
  <section id="login" class="login">
    <div class="login-logo">M+</div>
    <h2>Mensagens Plus</h2>
    <p>Parceira Vem Comigo Deus</p>

    <input id="email" type="email"
      placeholder="Seu e-mail"
      autocomplete="email">

    <input id="senha" type="password"
      placeholder="Sua senha"
      autocomplete="current-password">

    <div class="botoes-login">
      <button id="entrar">Entrar</button>
      <button id="cadastrar">Criar conta</button>
    </div>

    <button id="google">
      Entrar com Google
    </button>

    <p id="aviso-login" role="status"></p>
  </section>

  <!-- APLICATIVO -->
  <section id="app" class="app oculto">

    <aside>
      <div class="topo-contatos">
        <div class="topo-linha">
          <h2>Mensagens Plus</h2>
          <button class="topo-icone"
            id="novo-contato"
            title="Pesquisar contato"
            aria-label="Pesquisar contato">＋</button>
        </div>

        <div id="usuario-atual"
          class="identidade"></div>
      </div>

      <div class="pesquisa">
        <span>⌕</span>
        <input id="buscar-contato"
          type="search"
          placeholder="Pesquisar contato...">
      </div>

      <div class="filtros">
        <button class="filtro ativo"
          type="button">Todas</button>
      </div>

      <div id="contatos">
        Carregando contatos...
      </div>

      <nav class="navegacao"
        aria-label="Navegação principal">

        <button class="nav-item ativo"
          id="nav-conversas"
          type="button">
          <span class="simbolo">▣</span>
          Conversas
        </button>

        <button class="nav-item"
          id="nav-perfil"
          type="button">
          <span class="simbolo">◉</span>
          Você
        </button>
      </nav>
    </aside>

    <!-- CONVERSA -->
    <section class="conversa">

      <div class="barra-chat">
        <button id="voltar-chat"
          type="button"
          aria-label="Voltar">←</button>

        <div class="avatar-chat"
          id="avatar-chat">M+</div>

        <div class="dados-chat">
          <div id="titulo-chat"
            class="titulo-chat">
            Selecione uma conversa
          </div>
          <div class="info-chat">
            Mensagens particulares
          </div>
        </div>
      </div>

      <div id="mensagens"
        class="mensagens"
        aria-live="polite"></div>

      <form id="form-enviar" class="enviar">
        <input id="texto"
          type="text"
          maxlength="3000"
          autocomplete="off"
          placeholder="Mensagem"
          disabled>
        <button id="botao-enviar"
          type="submit"
          aria-label="Enviar"
          disabled>➤</button>
      </form>

      <div id="aviso-chat"
        role="status"></div>
    </section>

  </section>
</div>

<!-- SISTEMA EXISTENTE -->
<script type="module" src="./app.js"></script>
<script type="module" src="./perfil.js"></script>
<script type="module" src="./notificacoes.js"></script>

<!-- INTERFACE -->
<script>
(() => {
  const app = document.getElementById("app");
  const contatos = document.getElementById("contatos");
  const busca = document.getElementById("buscar-contato");
  const avatarChat = document.getElementById("avatar-chat");

  function iniciais(nome) {
    return (nome || "M+").trim()
      .split(/\s+/)
      .slice(0,2)
      .map(p => p.charAt(0))
      .join("")
      .toUpperCase();
  }

  function organizar() {
    contatos.querySelectorAll(".contato").forEach(item => {
      if (item.dataset.estilizado === "1") return;

      const nome = item.textContent.trim();
      item.dataset.estilizado = "1";
      item.dataset.nome = nome.toLowerCase();

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = iniciais(nome);

      const info = document.createElement("div");
      info.className = "contato-info";

      const topo = document.createElement("div");
      topo.className = "contato-topo";

      const titulo = document.createElement("div");
      titulo.className = "contato-nome";
      titulo.textContent = nome;

      const descricao = document.createElement("div");
      descricao.className = "contato-sub";
      descricao.textContent = "Toque para conversar";

      topo.append(titulo);
      info.append(topo,descricao);

      item.replaceChildren(avatar,info);
    });

    filtrar();
  }

  function filtrar() {
    const texto = busca.value.toLowerCase().trim();

    contatos.querySelectorAll(".contato").forEach(item => {
      item.style.display =
        (item.dataset.nome || "").includes(texto)
          ? "" : "none";
    });
  }

  new MutationObserver(organizar).observe(
    contatos,{childList:true}
  );

  organizar();

  busca.addEventListener("input",filtrar);

  document.getElementById("novo-contato")
    .onclick = () => busca.focus();

  contatos.addEventListener("click", e => {
    const item = e.target.closest(".contato");
    if (!item) return;

    const nome = item.querySelector(".contato-nome")
      ?.textContent || "Contato";

    avatarChat.textContent = iniciais(nome);
    app.classList.add("chat-aberto");
  });

  document.getElementById("voltar-chat")
    .onclick = () => app.classList.remove("chat-aberto");

  document.getElementById("nav-perfil")
    .onclick = () => {
      document.querySelector(".mp-perfil-btn")?.click();
    };

  document.getElementById("nav-conversas")
    .onclick = () => app.classList.remove("chat-aberto");

  new MutationObserver(() => {
    if (app.classList.contains("oculto")) {
      app.classList.remove("chat-aberto");
    }
  }).observe(app,{
    attributes:true,
    attributeFilter:["class"]
  });
})();
</script>
</body>
</html>
