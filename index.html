
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport"
 content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#075e54">
<meta name="description"
 content="Mensagens Plus - Parceira Vem Comigo Deus">

<title>Mensagens Plus</title>

<style>
:root {
  --verde: #00a884;
  --verde-escuro: #075e54;
  --fundo: #0b141a;
  --painel: #111b21;
  --painel2: #202c33;
  --linha: #27343b;
  --texto: #e9edef;
  --cinza: #8696a0;
  --bolha: #005c4b;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  background: var(--fundo);
  color: var(--texto);
  font-family: Arial, Helvetica, sans-serif;
}

button,
input {
  font-family: inherit;
}

button {
  cursor: pointer;
}

.oculto {
  display: none !important;
}

/* CABEÇALHO PRINCIPAL */
header {
  background: var(--painel2);
  min-height: 66px;
  padding: 11px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.marca {
  display: flex;
  align-items: center;
  gap: 11px;
}

.logo {
  width: 42px;
  height: 42px;
  background: var(--verde);
  color: #062a23;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 23px;
  font-weight: bold;
}

h1 {
  margin: 0;
  font-size: 20px;
}

.verde {
  color: #39dca9;
}

.subtitulo {
  color: #aebdc4;
  font-size: 11px;
  margin-top: 4px;
}

#sair {
  background: #34434a;
  color: white;
  border: 0;
  border-radius: 18px;
  padding: 9px 14px;
}

/* LOGIN */
.login {
  width: calc(100% - 30px);
  max-width: 420px;
  margin: 65px auto;
  background: var(--painel);
  padding: 27px;
  border-radius: 18px;
  box-shadow: 0 8px 28px #0005;
  text-align: center;
}

.login-logo {
  margin: 0 auto 20px;
  width: 75px;
  height: 75px;
  background: var(--verde);
  color: #063329;
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-size: 35px;
  font-weight: bold;
}

.login h2 {
  font-size: 22px;
  margin-bottom: 8px;
}

.login p {
  color: #aebdc4;
  font-size: 14px;
  line-height: 1.6;
}

.login input {
  display: block;
  width: 100%;
  padding: 15px;
  margin: 13px 0;
  border: 1px solid #3b4a53;
  background: #202c33;
  color: white;
  border-radius: 10px;
  outline: none;
  font-size: 15px;
}

.login input:focus,
.enviar input:focus {
  border-color: var(--verde);
}

.login button {
  border: 0;
  padding: 13px 17px;
  border-radius: 10px;
  font-weight: bold;
  margin: 4px;
  background: var(--verde);
  color: #042a20;
}

.login .secundario {
  background: #304047;
  color: white;
}

#google {
  width: 100%;
  margin: 15px 0 0;
}

.aviso {
  padding: 4px 12px;
  color: #ffca76;
  font-size: 13px;
  min-height: 18px;
}

/* APLICATIVO */
.container {
  max-width: 1450px;
  margin: auto;
}

.app {
  display: grid;
  grid-template-columns: 350px minmax(0,1fr);
  height: calc(100dvh - 66px);
  background: var(--fundo);
  border-left: 1px solid var(--linha);
  border-right: 1px solid var(--linha);
}

/* LISTA DE CONTATOS */
aside {
  background: var(--painel);
  border-right: 1px solid var(--linha);
  overflow-y: auto;
  min-width: 0;
}

.topo-contatos {
  background: var(--painel);
  padding: 22px 18px 14px;
  position: sticky;
  top: 0;
  z-index: 2;
}

.topo-contatos h2 {
  margin: 0 0 16px;
  font-size: 24px;
  font-weight: 700;
}

.identidade {
  font-size: 12px;
  color: var(--cinza);
  padding: 9px 12px;
  background: #202c33;
  border-radius: 9px;
  overflow-wrap: anywhere;
}

.titulo-lista {
  padding: 16px 18px 8px;
  color: var(--verde);
  font-size: 13px;
  font-weight: bold;
}

#contatos {
  padding-bottom: 20px;
}

.contato {
  display: flex;
  align-items: center;
  gap: 13px;
  min-height: 76px;
  padding: 12px 16px;
  border-bottom: 1px solid #233038;
  cursor: pointer;
}

.contato:hover,
.contato:focus {
  background: #202c33;
  outline: none;
}

.avatar {
  flex-shrink: 0;
  width: 50px;
  height: 50px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #285a51;
  color: white;
  font-size: 21px;
  font-weight: bold;
}

.contato-info {
  min-width: 0;
  flex: 1;
}

.contato-nome {
  color: var(--texto);
  font-size: 16px;
  font-weight: 500;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.contato-sub {
  color: var(--cinza);
  font-size: 12px;
  margin-top: 6px;
}

.seta-contato {
  color: var(--cinza);
  font-size: 22px;
}

/* CONVERSA */
.conversa {
  min-width: 0;
  min-height: 0;
  display: flex;
  flex-direction: column;
  background-color: #0b141a;
  background-image:
    radial-gradient(#ffffff08 1px, transparent 1px);
  background-size: 23px 23px;
}

.barra-chat {
  min-height: 65px;
  background: #202c33;
  display: flex;
  align-items: center;
  padding: 9px 15px;
  gap: 12px;
}

#voltar-chat {
  background: transparent;
  border: 0;
  color: white;
  font-size: 26px;
  display: none;
  padding: 5px;
}

.avatar-chat {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  background: #285a51;
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: white;
  font-weight: bold;
  font-size: 19px;
}

.dados-chat {
  flex: 1;
  min-width: 0;
}

.titulo-chat {
  font-size: 16px;
  font-weight: bold;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.info-chat {
  color: #aebdc4;
  font-size: 12px;
  margin-top: 5px;
}

/* MENSAGENS */
.mensagens {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 7px;
}

.bolha {
  background: #202c33;
  border-radius: 3px 13px 13px 13px;
  padding: 10px 13px;
  max-width: 78%;
  align-self: flex-start;
  word-break: break-word;
  white-space: pre-wrap;
  line-height: 1.5;
  font-size: 14px;
  box-shadow: 0 1px 2px #0003;
}

.bolha.minha {
  background: var(--bolha);
  border-radius: 13px 3px 13px 13px;
  align-self: flex-end;
}

/* DIGITAR MENSAGEM */
.enviar {
  display: flex;
  align-items: center;
  background: #202c33;
  padding: 10px 13px;
  gap: 10px;
}

.enviar input {
  min-width: 0;
  flex: 1;
  background: #2a3942;
  color: white;
  border: 1px solid transparent;
  border-radius: 25px;
  padding: 14px 18px;
  font-size: 15px;
  outline: none;
}

.enviar input::placeholder {
  color: #aebdc4;
}

.enviar button {
  flex-shrink: 0;
  width: 49px;
  height: 49px;
  border: 0;
  border-radius: 50%;
  background: var(--verde);
  color: #043326;
  font-size: 23px;
  display: grid;
  place-items: center;
}

.enviar button:disabled {
  opacity: .4;
}

#aviso-chat {
  background: #202c33;
}

.rodape-login {
  margin-top: 24px;
  color: #73858d;
  font-size: 12px;
}

/* CELULAR */
@media(max-width: 700px) {
  header {
    height: 65px;
    padding: 9px 13px;
  }

  h1 {
    font-size: 19px;
  }

  .logo {
    height: 39px;
    width: 39px;
  }

  .app {
    display: block;
    height: calc(100dvh - 65px);
    border: 0;
  }

  aside {
    width: 100%;
    height: 100%;
    border-right: 0;
  }

  .conversa {
    display: none;
    height: 100%;
  }

  .app.chat-aberto aside {
    display: none;
  }

  .app.chat-aberto .conversa {
    display: flex;
  }

  #voltar-chat {
    display: block;
  }

  .mensagens {
    padding: 14px 10px;
  }

  .bolha {
    max-width: 86%;
  }

  .enviar {
    gap: 7px;
    padding: 8px;
  }

  .enviar input {
    padding: 13px;
    font-size: 16px;
  }

  .login {
    margin: 25px auto;
  }
}
</style>
</head>

<body>

<header>
  <div class="marca">
    <div class="logo">M+</div>
    <div>
      <h1>Mensagens <span class="verde">Plus</span></h1>
      <div class="subtitulo">
        Parceira Vem Comigo Deus
      </div>
    </div>
  </div>

  <button id="sair" class="oculto">
    Sair
  </button>
</header>

<div class="container">

  <!-- TELA DE LOGIN -->
  <section id="login" class="login">

    <div class="login-logo">M+</div>

    <h2>Bem-vindo ao Mensagens Plus</h2>

    <p>
      Converse com amigos e familiares.
      Entre ou crie sua conta.
    </p>

    <input
      id="email"
      type="email"
      placeholder="Seu e-mail"
      autocomplete="email">

    <input
      id="senha"
      type="password"
      placeholder="Sua senha"
      autocomplete="current-password">

    <button id="entrar">
      Entrar
    </button>

    <button id="cadastrar" class="secundario">
      Criar conta
    </button>

    <button id="google" class="secundario">
      Entrar com Google
    </button>

    <div id="aviso-login"
         class="aviso"
         role="status"></div>

    <div class="rodape-login">
      Mensagens Plus © 2026
      <br>
      Parceira Vem Comigo Deus
    </div>

  </section>

  <!-- APLICATIVO -->
  <section id="app" class="app oculto">

    <!-- CONTATOS -->
    <aside id="area-contatos">

      <div class="topo-contatos">
        <h2>Conversas</h2>

        <div id="usuario-atual"
             class="identidade"></div>
      </div>

      <div class="titulo-lista">
        CONTATOS
      </div>

      <div id="contatos">
        Carregando contatos...
      </div>

    </aside>

    <!-- JANELA DA CONVERSA -->
    <div class="conversa">

      <div class="barra-chat">

        <button
          type="button"
          id="voltar-chat"
          aria-label="Voltar aos contatos">
          &#8592;
        </button>

        <div class="avatar-chat"
             id="avatar-chat">
          M+
        </div>

        <div class="dados-chat">

          <div id="titulo-chat"
               class="titulo-chat">
            Selecione uma pessoa para conversar
          </div>

          <div class="info-chat">
            Mensagens Plus
          </div>

        </div>

      </div>

      <div id="mensagens"
           class="mensagens"
           aria-live="polite">
      </div>

      <form id="form-enviar" class="enviar">

        <input
          id="texto"
          type="text"
          placeholder="Digite sua mensagem..."
          maxlength="3000"
          autocomplete="off"
          disabled>

        <button
          id="botao-enviar"
          type="submit"
          aria-label="Enviar mensagem"
          disabled>
          &#10148;
        </button>

      </form>

      <div id="aviso-chat"
           class="aviso"
           role="status"></div>

    </div>

  </section>

</div>

<!-- MOTOR DE MENSAGENS -->
<script type="module" src="./app.js"></script>

<!-- NAVEGAÇÃO VISUAL DO CELULAR -->
<script>
(function() {
  const app = document.getElementById("app");
  const contatos = document.getElementById("contatos");
  const voltar = document.getElementById("voltar-chat");
  const titulo = document.getElementById("titulo-chat");
  const avatarChat = document.getElementById("avatar-chat");

  function iniciais(nome) {
    return (nome || "M+")
      .trim()
      .split(/\s+/)
      .slice(0, 2)
      .map(parte => parte.charAt(0))
      .join("")
      .toUpperCase();
  }

  function decorarContatos() {
    contatos.querySelectorAll(".contato").forEach(item => {
      if (item.dataset.visualPronto) return;

      const nome = item.textContent.trim();

      item.dataset.visualPronto = "1";
      item.textContent = "";

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = iniciais(nome);

      const info = document.createElement("div");
      info.className = "contato-info";

      const textoNome = document.createElement("div");
      textoNome.className = "contato-nome";
      textoNome.textContent = nome;

      const subtitulo = document.createElement("div");
      subtitulo.className = "contato-sub";
      subtitulo.textContent = "Toque para conversar";

      const seta = document.createElement("div");
      seta.className = "seta-contato";
      seta.textContent = "›";

      info.append(textoNome, subtitulo);
      item.append(avatar, info, seta);
    });
  }

  const observador = new MutationObserver(decorarContatos);

  observador.observe(contatos, {
    childList: true
  });

  decorarContatos();

  contatos.addEventListener("click", evento => {
    const contato = evento.target.closest(".contato");

    if (!contato) return;

    const nome = contato.querySelector(".contato-nome")
      ?.textContent || "Contato";

    avatarChat.textContent = iniciais(nome);
    app.classList.add("chat-aberto");
  });

  contatos.addEventListener("keydown", evento => {
    if (evento.key !== "Enter") return;

    const contato = evento.target.closest(".contato");

    if (contato) {
      app.classList.add("chat-aberto");
    }
  });

  voltar.addEventListener("click", () => {
    app.classList.remove("chat-aberto");
  });

  // Ao sair da conta, mostrar lista novamente
  const observarSessao = new MutationObserver(() => {
    if (app.classList.contains("oculto")) {
      app.classList.remove("chat-aberto");
    }
  });

  observarSessao.observe(app, {
    attributes: true,
    attributeFilter: ["class"]
  });
})();
</script>

</body>
</html>
