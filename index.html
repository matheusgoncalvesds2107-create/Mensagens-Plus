
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#111b21">
<meta name="description" content="Mensagens Plus - Parceira Vem Comigo Deus">
<title>Mensagens Plus</title>

<style>
:root {
  --bg: #0b141a;
  --surface: #111b21;
  --surface2: #202c33;
  --hover: #2a3942;
  --green: #00a884;
  --green-light: #25d6ac;
  --text: #e9edef;
  --muted: #8696a0;
  --border: #28363e;
  --bubble: #005c4b;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, Arial, sans-serif;
  -webkit-tap-highlight-color: transparent;
}

button, input { font: inherit; }
button { cursor: pointer; }
.oculto { display: none !important; }

button:focus-visible,
input:focus-visible,
.contato:focus-visible {
  outline: 2px solid var(--green-light);
  outline-offset: 2px;
}

/* CABEÇALHO */

header {
  height: 68px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 0 20px;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
}

.marca {
  display: flex;
  align-items: center;
  gap: 12px;
}

.logo {
  width: 43px;
  height: 43px;
  border-radius: 15px;
  display: grid;
  place-items: center;
  background: linear-gradient(135deg,#25d6ac,#00876a);
  color: #06362c;
  font-weight: 900;
  font-size: 19px;
}

h1 {
  font-size: 19px;
  letter-spacing: -.5px;
  margin: 0;
}

.verde { color: var(--green-light); }

.subtitulo {
  margin-top: 4px;
  font-size: 11px;
  color: var(--muted);
}

#sair {
  background: var(--surface2);
  border: 1px solid var(--border);
  color: var(--text);
  padding: 9px 17px;
  border-radius: 25px;
}

/* LOGIN */

.container {
  height: calc(100dvh - 68px);
  max-width: 1500px;
  margin: auto;
}

.login {
  max-width: 430px;
  width: calc(100% - 30px);
  margin: min(8vh,70px) auto 0;
  background: var(--surface);
  border: 1px solid var(--border);
  padding: 30px 25px;
  border-radius: 22px;
  text-align: center;
  box-shadow: 0 16px 55px #0003;
}

.login-logo {
  width: 76px;
  height: 76px;
  border-radius: 23px;
  background: linear-gradient(135deg,#29e5b5,#007e65);
  display: grid;
  place-items: center;
  color: #05382d;
  font-size: 29px;
  font-weight: 900;
  margin: 0 auto 24px;
}

.login h2 {
  font-size: 24px;
  margin: 0 0 10px;
}

.login p {
  color: var(--muted);
  font-size: 14px;
  line-height: 1.6;
}

.login input {
  width: 100%;
  border: 1px solid #34444c;
  background: var(--surface2);
  color: var(--text);
  border-radius: 12px;
  padding: 15px;
  margin: 7px 0;
  outline: none;
}

.login input:focus {
  border-color: var(--green);
}

.login button {
  padding: 13px;
  border: 0;
  border-radius: 12px;
  font-weight: 700;
}

.botoes-login {
  display: flex;
  gap: 10px;
  margin-top: 12px;
}

#entrar {
  flex: 1;
  background: var(--green);
  color: #05271f;
}

#cadastrar {
  flex: 1;
  background: var(--surface2);
  color: var(--text);
}

#google {
  width: 100%;
  margin-top: 14px;
  background: #e9edef;
  color: #202c33;
}

.aviso {
  color: #ffcc82;
  font-size: 13px;
  padding: 5px 14px;
  min-height: 22px;
}

.rodape-login {
  margin-top: 24px;
  color: var(--muted);
  font-size: 12px;
}

/* ESTRUTURA DO APP */

.app {
  display: grid;
  grid-template-columns: 370px minmax(0,1fr);
  height: 100%;
  min-height: 0;
  background: var(--surface);
  border-left: 1px solid var(--border);
  border-right: 1px solid var(--border);
}

/* LISTA DE CONVERSAS */

aside {
  min-height: 0;
  min-width: 0;
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
}

.topo-contatos {
  padding: 22px 20px 14px;
}

.topo-contatos h2 {
  font-size: 26px;
  letter-spacing: -.7px;
  margin: 0 0 17px;
}

.identidade {
  background: var(--surface2);
  color: var(--muted);
  border-radius: 11px;
  padding: 12px;
  font-size: 12px;
  overflow-wrap: anywhere;
}

.pesquisa {
  padding: 8px 14px 12px;
}

.pesquisa input {
  width: 100%;
  border: 0;
  border-bottom: 2px solid transparent;
  outline: none;
  padding: 12px 16px;
  background: var(--surface2);
  color: var(--text);
  border-radius: 12px;
}

.pesquisa input:focus {
  border-bottom-color: var(--green);
}

.abas {
  display: flex;
  padding: 0 15px;
  border-bottom: 1px solid var(--border);
}

.aba {
  color: var(--green-light);
  padding: 12px 8px;
  font-size: 13px;
  font-weight: 700;
  border-bottom: 3px solid var(--green);
}

#contatos {
  flex: 1;
  overflow-y: auto;
  min-height: 0;
}

.contato {
  display: flex;
  align-items: center;
  padding: 13px 16px;
  gap: 13px;
  min-height: 78px;
  border-bottom: 1px solid #ffffff0b;
  cursor: pointer;
  transition: background .15s;
}

.contato:hover {
  background: var(--hover);
}

.avatar {
  flex-shrink: 0;
  width: 51px;
  height: 51px;
  background: linear-gradient(145deg,#318e78,#165547);
  border-radius: 50%;
  display: grid;
  place-items: center;
  color: white;
  font-size: 18px;
  font-weight: 700;
}

.contato-info {
  flex: 1;
  min-width: 0;
}

.contato-nome {
  font-size: 16px;
  font-weight: 600;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.contato-sub {
  font-size: 12px;
  color: var(--muted);
  margin-top: 6px;
}

.contato-seta {
  color: var(--muted);
  font-size: 20px;
}

/* CONVERSA */

.conversa {
  display: flex;
  min-width: 0;
  min-height: 0;
  flex-direction: column;
  background-color: #0b141a;
  background-image:
    radial-gradient(#ffffff07 1px,transparent 1px);
  background-size: 26px 26px;
}

.barra-chat {
  background: var(--surface2);
  height: 68px;
  min-height: 68px;
  display: flex;
  align-items: center;
  padding: 0 17px;
  gap: 12px;
}

#voltar-chat {
  display: none;
  background: transparent;
  border: 0;
  color: var(--text);
  font-size: 27px;
  padding: 7px;
}

.avatar-chat {
  width: 43px;
  height: 43px;
  flex-shrink: 0;
  background: linear-gradient(135deg,#318e78,#165547);
  border-radius: 50%;
  display: grid;
  place-items: center;
  font-weight: 700;
}

.dados-chat {
  flex: 1;
  min-width: 0;
}

.titulo-chat {
  font-size: 16px;
  font-weight: 650;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.info-chat {
  font-size: 12px;
  color: var(--muted);
  margin-top: 4px;
}

.mensagens {
  flex: 1;
  min-height: 0;
  display: flex;
  flex-direction: column;
  gap: 8px;
  overflow-y: auto;
  padding: 22px 7%;
}

.bolha {
  background: var(--surface2);
  color: var(--text);
  max-width: 75%;
  padding: 11px 14px;
  border-radius: 4px 14px 14px 14px;
  align-self: flex-start;
  font-size: 14px;
  line-height: 1.5;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
  box-shadow: 0 2px 4px #0002;
}

.bolha.minha {
  background: var(--bubble);
  border-radius: 14px 4px 14px 14px;
  align-self: flex-end;
}

/* CAMPO DE MENSAGEM */

.enviar {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 11px 17px;
  background: var(--surface2);
}

.enviar input {
  min-width: 0;
  flex: 1;
  background: #2a3942;
  color: var(--text);
  border: 1px solid transparent;
  border-radius: 26px;
  padding: 14px 18px;
  outline: none;
}

.enviar input:focus {
  border-color: #48766c;
}

.enviar button {
  flex-shrink: 0;
  background: var(--green);
  color: #042c22;
  border: 0;
  border-radius: 50%;
  width: 48px;
  height: 48px;
  display: grid;
  place-items: center;
}

.enviar button:disabled {
  opacity: .45;
}

#aviso-chat {
  background: var(--surface2);
}

/* VERSÃO CELULAR */

@media(max-width:700px) {
  header {
    height: 62px;
    padding: 0 13px;
  }

  .container {
    height: calc(100dvh - 62px);
  }

  .logo {
    width: 38px;
    height: 38px;
    border-radius: 12px;
  }

  h1 { font-size: 18px; }

  .app {
    display: block;
    border: 0;
  }

  aside {
    width: 100%;
    height: 100%;
    border: 0;
  }

  .conversa {
    display: none;
    height: 100%;
  }

  .app.chat-aberto aside {
    display: none;
  }

  .app.chat-aberto .conversa {
    display: flex;
  }

  #voltar-chat {
    display: block;
  }

  .barra-chat {
    padding: 0 9px;
  }

  .mensagens {
    padding: 15px 11px;
  }

  .bolha {
    max-width: 86%;
  }

  .enviar {
    gap: 7px;
    padding: 9px;
    padding-bottom: max(9px,env(safe-area-inset-bottom));
  }

  .enviar input {
    font-size: 16px;
  }

  .login {
    margin: 24px auto;
    max-height: calc(100% - 36px);
    overflow-y: auto;
  }
}
</style>
</head>

<body>

<header>
  <div class="marca">
    <div class="logo">M+</div>
    <div>
      <h1>Mensagens <span class="verde">Plus</span></h1>
      <div class="subtitulo">
        Parceira Vem Comigo Deus
      </div>
    </div>
  </div>

  <button id="sair" class="oculto">
    Sair
  </button>
</header>

<div class="container">

  <!-- LOGIN -->
  <section id="login" class="login">
    <div class="login-logo">M+</div>

    <h2>Bem-vindo ao Mensagens Plus</h2>

    <p>
      Conecte-se com quem importa.
      Converse de forma simples e rápida.
    </p>

    <input
      id="email"
      type="email"
      placeholder="Seu e-mail"
      autocomplete="email">

    <input
      id="senha"
      type="password"
      placeholder="Sua senha"
      autocomplete="current-password">

    <div class="botoes-login">
      <button id="entrar">Entrar</button>
      <button id="cadastrar">Criar conta</button>
    </div>

    <button id="google">
      Entrar com Google
    </button>

    <div id="aviso-login" class="aviso" role="status"></div>

    <div class="rodape-login">
      Mensagens Plus © 2026
      <p>Parceira Vem Comigo Deus</p>
    </div>
  </section>

  <!-- APLICATIVO -->
  <section id="app" class="app oculto">

    <!-- LISTA DE CONTATOS -->
    <aside>

      <div class="topo-contatos">
        <h2>Conversas</h2>

        <div id="usuario-atual" class="identidade">
        </div>
      </div>

      <div class="pesquisa">
        <input
          type="search"
          id="buscar-contato"
          placeholder="Pesquisar contato..."
          aria-label="Pesquisar contato">
      </div>

      <div class="abas">
        <div class="aba">Todos os contatos</div>
      </div>

      <div id="contatos">
        Carregando contatos...
      </div>

    </aside>

    <!-- ÁREA DE CONVERSAS -->
    <div class="conversa">

      <div class="barra-chat">

        <button id="voltar-chat"
                type="button"
                aria-label="Voltar aos contatos">
          &#8592;
        </button>

        <div class="avatar-chat" id="avatar-chat">
          M+
        </div>

        <div class="dados-chat">
          <div id="titulo-chat" class="titulo-chat">
            Selecione uma pessoa para conversar
          </div>

          <div class="info-chat">
            Mensagens Plus
          </div>
        </div>
      </div>

      <div
        id="mensagens"
        class="mensagens"
        aria-live="polite">
      </div>

      <form id="form-enviar" class="enviar">

        <input
          type="text"
          id="texto"
          maxlength="3000"
          placeholder="Digite sua mensagem..."
          autocomplete="off"
          disabled>

        <button
          type="submit"
          id="botao-enviar"
          aria-label="Enviar mensagem"
          disabled>

          <svg width="23" height="23"
               viewBox="0 0 24 24"
               fill="none"
               stroke="currentColor"
               stroke-width="2.2"
               stroke-linecap="round"
               stroke-linejoin="round">
            <path d="m22 2-7 20-4-9-9-4Z"/>
            <path d="M22 2 11 13"/>
          </svg>

        </button>
      </form>

      <div id="aviso-chat" class="aviso" role="status"></div>
    </div>

  </section>
</div>

<!-- FIREBASE E MENSAGENS -->
<script type="module" src="./app.js"></script>

<script type="module" src="./perfil.js"></script>
  
<script type="module" src="./notificacoes.js"></script>

<!-- MELHORIAS DA INTERFACE -->
<script>
(() => {
  const app = document.getElementById("app");
  const contatos = document.getElementById("contatos");
  const busca = document.getElementById("buscar-contato");
  const voltar = document.getElementById("voltar-chat");
  const avatarChat = document.getElementById("avatar-chat");

  function iniciais(nome) {
    return (nome || "M+")
      .trim()
      .split(/\s+/)
      .slice(0, 2)
      .map(p => p.charAt(0))
      .join("")
      .toUpperCase();
  }

  // Apenas melhora a apresentação.
  // Não altera o código Firebase.

  function organizarContatos() {
    const itens = contatos.querySelectorAll(".contato");

    itens.forEach(item => {
      if (item.dataset.pronto === "sim") return;

      const nome = item.textContent.trim();

      item.dataset.pronto = "sim";
      item.dataset.nome = nome.toLowerCase();

      item.replaceChildren();

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = iniciais(nome);

      const info = document.createElement("div");
      info.className = "contato-info";

      const titulo = document.createElement("div");
      titulo.className = "contato-nome";
      titulo.textContent = nome;

      const subtitulo = document.createElement("div");
      subtitulo.className = "contato-sub";
      subtitulo.textContent = "Toque para conversar";

      const seta = document.createElement("span");
      seta.className = "contato-seta";
      seta.textContent = "›";

      info.append(titulo, subtitulo);
      item.append(avatar, info, seta);
    });

    filtrarContatos();
  }

  function filtrarContatos() {
    const texto = busca.value.toLowerCase().trim();

    contatos.querySelectorAll(".contato").forEach(item => {
      const nome = item.dataset.nome || "";
      item.style.display = nome.includes(texto) ? "" : "none";
    });
  }

  busca.addEventListener("input", filtrarContatos);

  const observador = new MutationObserver(organizarContatos);

  observador.observe(contatos, {
    childList: true
  });

  organizarContatos();

  // Navegação no celular.
  contatos.addEventListener("click", evento => {
    const item = evento.target.closest(".contato");

    if (!item) return;

    const nome = item.querySelector(".contato-nome")
      ?.textContent || "Contato";

    avatarChat.textContent = iniciais(nome);
    app.classList.add("chat-aberto");
  });

  contatos.addEventListener("keydown", evento => {
    if (evento.key === "Enter" &&
        evento.target.closest(".contato")) {
      app.classList.add("chat-aberto");
    }
  });

  voltar.addEventListener("click", () => {
    app.classList.remove("chat-aberto");
  });

  // Voltar à lista ao encerrar a sessão.
  const sessao = new MutationObserver(() => {
    if (app.classList.contains("oculto")) {
      app.classList.remove("chat-aberto");
    }
  });

  sessao.observe(app, {
    attributes: true,
    attributeFilter: ["class"]
  });
})();
</script>

</body>
</html>
