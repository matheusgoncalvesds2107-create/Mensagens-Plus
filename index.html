<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Mensagens Plus - Parceira Vem Comigo Deus">

<title>Mensagens Plus</title>

<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" href="/icon-192.png">
<link rel="apple-touch-icon" href="/icon-192.png">

<style>
:root {
  --green: #008f68;
  --green-light: #d9f3e3;
  --white: #ffffff;
  --text: #111b21;
  --muted: #667781;
  --line: #edf0f1;
  --chat: #111821;
}

* { box-sizing: border-box; }

html, body {
  margin: 0;
  width: 100%;
  height: 100%;
  overflow: hidden;
}

body {
  background: #f5f6f7;
  color: var(--text);
  font-family: Arial, Helvetica, sans-serif;
}

button, input { font: inherit; }
button { cursor: pointer; }

button:focus-visible,
input:focus-visible,
.contato:focus-visible {
  outline: 2px solid #00a884;
  outline-offset: 2px;
}

.oculto { display: none !important; }
header { display: none; }

.container {
  width: 100%;
  max-width: 1350px;
  height: 100dvh;
  margin: auto;
  background: #ffffff;
}

.app {
  display: grid;
  grid-template-columns: 370px minmax(0, 1fr);
  height: 100%;
  min-height: 0;
}

/* CONTATOS */

aside {
  min-height: 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  background: #ffffff;
  border-right: 1px solid #e5e9eb;
}

.topo-contatos { padding: 20px 16px 8px; }

.topo-linha {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
}

.topo-linha h2 {
  margin: 0;
  color: #087b5d;
  font-size: 26px;
  font-weight: 750;
  letter-spacing: -.5px;
}

.topo-icone {
  width: 42px;
  height: 42px;
  flex-shrink: 0;
  border: 0;
  border-radius: 50%;
  background: #e7f5ee;
  color: #087b5d;
  font-size: 26px;
}

.identidade {
  margin-top: 8px;
  font-size: 12px;
  color: #667781;
  overflow-wrap: anywhere;
}

.pesquisa {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 12px 15px;
  padding: 0 15px;
  border-radius: 30px;
  background: #f0f2f5;
}

.pesquisa span { color: #667781; font-size: 21px; }

.pesquisa input {
  flex: 1;
  min-width: 0;
  width: 100%;
  border: 0;
  outline: none;
  background: transparent;
  padding: 15px 0;
  font-size: 15px;
  color: #111b21;
}

.filtros {
  display: flex;
  gap: 8px;
  padding: 8px 15px 14px;
}

.filtro {
  border: 1px solid #dce2e5;
  background: #ffffff;
  color: #45545b;
  border-radius: 25px;
  padding: 9px 18px;
  font-size: 13px;
}

.filtro.ativo {
  background: #d9f3e3;
  border-color: #d9f3e3;
  color: #087b5d;
  font-weight: bold;
}

#contatos {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  overflow-x: hidden;
}

.contato {
  display: flex;
  align-items: center;
  gap: 13px;
  min-height: 80px;
  padding: 12px 16px;
  border-bottom: 1px solid #edf0f1;
  cursor: pointer;
}

.contato:hover { background: #f6f7f8; }

.avatar {
  width: 55px;
  height: 55px;
  flex-shrink: 0;
  border-radius: 50%;
  background: linear-gradient(145deg,#29be93,#087b5d);
  display: grid;
  place-items: center;
  color: white;
  font-size: 19px;
  font-weight: bold;
  overflow: hidden;
}

.avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.contato-info { min-width: 0; flex: 1; }

.contato-topo {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}

.contato-nome {
  font-size: 16px;
  font-weight: bold;
  color: #111b21;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.contato-hora {
  flex-shrink: 0;
  color: #84929a;
  font-size: 11px;
}

.contato-sub {
  color: #667781;
  font-size: 13px;
  margin-top: 6px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.navegacao {
  display: flex;
  align-items: center;
  justify-content: space-around;
  height: 73px;
  min-height: 73px;
  border-top: 1px solid #e8ecee;
  background: white;
}

.nav-item {
  border: 0;
  background: transparent;
  color: #667781;
  display: flex;
  align-items: center;
  flex-direction: column;
  gap: 5px;
  font-size: 12px;
  padding: 7px 15px;
}

.nav-item.ativo { color: #087b5d; font-weight: bold; }
.nav-item .simbolo { font-size: 24px; }

/* STATUS */

.tela-status {
  min-width: 0;
  min-height: 0;
  height: 100%;
  overflow-y: auto;
  background: #fff;
  padding: 22px;
}
.status-cabecalho h2 { margin: 0; color: #087b5d; }
.status-cabecalho p { color: #667781; font-size: 14px; }
.status-criar {
  display: flex;
  flex-direction: column;
  gap: 10px;
  margin: 18px 0 24px;
  padding: 16px;
  border: 1px solid #e5e9eb;
  border-radius: 16px;
}
.status-criar label { font-size: 13px; font-weight: bold; }
.status-criar textarea {
  width: 100%;
  min-height: 90px;
  resize: vertical;
  border: 1px solid #d5dddf;
  border-radius: 12px;
  padding: 12px;
  font: inherit;
}
.status-criar input { width: 100%; }
.status-criar button {
  border: 0;
  border-radius: 24px;
  padding: 13px;
  background: #00a884;
  color: white;
  font-weight: bold;
}
#status-aviso { margin: 0; font-size: 12px; color: #667781; overflow-wrap: anywhere; }
.lista-status { display: grid; gap: 12px; }
.status-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  border-bottom: 1px solid #edf0f1;
  overflow-wrap: anywhere;
}
.status-miniatura {
  width: 58px; height: 58px; flex-shrink: 0;
  border-radius: 50%; border: 3px solid #25b879;
  display: grid; place-items: center; overflow: hidden;
  background: #e7f5ee; color: #087b5d; font-size: 22px;
}
.status-miniatura img, .status-miniatura video {
  width: 100%; height: 100%; object-fit: cover;
}
.status-conteudo { min-width: 0; flex: 1; }
.status-hora { color: #667781; font-size: 12px; margin-top: 5px; }
.status-vazio { color: #667781; font-size: 14px; padding: 12px 0; }

.app.mostrando-status { grid-template-columns: 370px minmax(0, 1fr); }
.app.mostrando-status .conversa { display: none; }
.app.mostrando-status .tela-status { display: block !important; }

@media (max-width: 700px) {
  .app.mostrando-status { display: block; }
  .app.mostrando-status aside { display: flex; height: 100%; }
  .app.mostrando-status .tela-status { height: 100%; }
  .app.mostrando-status #contatos { display: none; }
  .app.mostrando-status .pesquisa,
  .app.mostrando-status .filtros { display: none; }
}

/* CONVERSA */

.conversa {
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  height: 100%;
  background: #111821;
}

.barra-chat {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px;
  min-height: 65px;
  background: #202c33;
  color: white;
}

#voltar-chat {
  border: 0;
  background: transparent;
  color: white;
  font-size: 27px;
  padding: 5px;
}

.avatar-chat {
  width: 43px;
  height: 43px;
  flex-shrink: 0;
  border-radius: 50%;
  background: #16896b;
  color: white;
  display: grid;
  place-items: center;
  font-size: 16px;
  font-weight: bold;
}

.dados-chat { flex: 1; min-width: 0; }

.titulo-chat {
  font-size: 16px;
  font-weight: bold;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.info-chat {
  color: #b7c5c9;
  font-size: 12px;
  margin-top: 4px;
}

.mensagens {
  flex: 1;
  min-height: 0;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 16px;
  background:
    repeating-linear-gradient(
      145deg,
      transparent 0px,
      transparent 68px,
      #ffffff05 70px,
      transparent 75px
    ),
    linear-gradient(145deg,#202a35,#111821);
}

.bolha {
  align-self: flex-start;
  max-width: 85%;
  background: #34414a;
  color: white;
  padding: 11px 14px;
  border-radius: 5px 13px 13px 13px;
  overflow-wrap: anywhere;
  white-space: pre-wrap;
  line-height: 1.5;
  font-size: 14px;
}

.bolha.minha {
  align-self: flex-end;
  background: #14664f;
  border-radius: 13px 5px 13px 13px;
}

.enviar {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #202c33;
  padding: 10px;
}

.enviar input {
  flex: 1;
  min-width: 0;
  width: 100%;
  border: 0;
  outline: 0;
  border-radius: 25px;
  padding: 14px;
  background: #34414a;
  color: white;
  font-size: 16px;
}

.enviar input::placeholder { color: #b8c5ca; }

.enviar button {
  width: 46px;
  height: 46px;
  min-width: 46px;
  flex-shrink: 0;
  border: 0;
  border-radius: 50%;
  background: #00a884;
  color: white;
  font-size: 21px;
}

.enviar button:disabled { opacity: .45; }

#aviso-chat {
  background: #202c33;
  color: #ffe0a1;
  font-size: 12px;
  padding: 0 12px;
}

/* LOGIN: E-MAIL E GOOGLE */

.login {
  width: calc(100% - 30px);
  max-width: 420px;
  margin: 6vh auto;
  padding: 26px;
  background: white;
  border-radius: 20px;
  text-align: center;
  box-shadow: 0 5px 25px #0002;
  max-height: calc(100dvh - 35px);
  overflow-y: auto;
}

.login-logo {
  width: 75px;
  height: 75px;
  margin: 0 auto 20px;
  background: #00a884;
  color: white;
  display: grid;
  place-items: center;
  border-radius: 22px;
  font-weight: bold;
  font-size: 29px;
}

.login h2 { margin: 0 0 12px; font-size: 24px; }
.login p { color: #667781; font-size: 14px; }

.login input {
  display: block;
  width: 100%;
  padding: 14px;
  margin: 12px 0;
  border: 1px solid #d5dddf;
  outline: none;
  border-radius: 12px;
  color: #111b21;
  background: white;
}

.login input:focus { border-color: #00a884; }

.botoes-login { display: flex; gap: 9px; }

.login button {
  padding: 13px;
  border: 0;
  border-radius: 12px;
  font-weight: bold;
}

#entrar {
  flex: 1;
  background: #00a884;
  color: white;
}

#cadastrar {
  flex: 1;
  background: #e7f4ed;
  color: #067550;
}

#google {
  width: 100%;
  margin-top: 12px;
  background: #eef1f2;
  color: #243138;
}

#aviso-login {
  color: #b54c30;
  font-size: 13px;
  margin-top: 10px;
  overflow-wrap: anywhere;
}

/* CELULAR */

@media (max-width: 700px) {
  .container { height: 100dvh; }

  .app {
    display: block;
    height: 100%;
  }

  aside {
    height: 100%;
    border: 0;
  }

  .conversa {
    display: none;
    height: 100%;
  }

  .app.chat-aberto aside { display: none; }
  .app.chat-aberto .conversa { display: flex; }

  .mensagens { padding: 14px 11px; }
  .bolha { max-width: 88%; }

  .enviar {
    padding-bottom: max(10px, env(safe-area-inset-bottom));
  }

  .navegacao {
    padding-bottom: env(safe-area-inset-bottom);
    height: calc(73px + env(safe-area-inset-bottom));
  }

  .login {
    margin: max(12px, 3vh) auto;
    padding: 22px;
    max-height: calc(100dvh - 24px);
  }
}
</style>
</head>

<body>

<header>
  <button id="sair" class="oculto" type="button">Sair</button>
</header>

<div class="container">

  <!-- LOGIN SEM TELEFONE -->
  <section id="login" class="login">
    <div class="login-logo">M+</div>

    <h2>Mensagens Plus</h2>
    <p>Parceira Vem Comigo Deus</p>

    <input
      id="email"
      type="email"
      placeholder="Seu e-mail"
      autocomplete="email">

    <input
      id="senha"
      type="password"
      placeholder="Sua senha"
      autocomplete="current-password">

    <div class="botoes-login">
      <button id="entrar" type="button">Entrar</button>
      <button id="cadastrar" type="button">Criar conta</button>
    </div>

    <button id="google" type="button">Entrar com Google</button>

    <p id="aviso-login" role="status" aria-live="polite"></p>
  </section>

  <!-- APLICATIVO -->
  <section id="app" class="app oculto">

    <aside>
      <div class="topo-contatos">
        <div class="topo-linha">
          <h2>Mensagens Plus</h2>
          <button
            class="topo-icone"
            id="novo-contato"
            type="button"
            title="Pesquisar contato"
            aria-label="Pesquisar contato">+</button>
        </div>

        <div id="usuario-atual" class="identidade"></div>
      </div>

      <div class="pesquisa">
        <span>⌕</span>
        <input
          id="buscar-contato"
          type="search"
          placeholder="Pesquisar contato..."
          aria-label="Pesquisar contato">
      </div>

      <div class="filtros">
        <button class="filtro ativo" type="button">Todas</button>
      </div>

      <div id="contatos">Carregando contatos...</div>

      <nav class="navegacao" aria-label="Navegação principal">
        <button class="nav-item ativo" id="nav-conversas" type="button">
          <span class="simbolo">▣</span>
          Mensagens
        </button>

        <button class="nav-item" id="nav-status" type="button">
          <span class="simbolo">◉</span>
          Status
        </button>
      </nav>
    </aside>

    <section id="tela-status" class="tela-status oculto">
      <div class="status-cabecalho">
        <h2>Status</h2>
        <p>Compartilhe fotos, vídeos ou textos por 24 horas.</p>
      </div>
      <div class="status-criar">
        <label for="status-texto">Escreva um status</label>
        <textarea id="status-texto" maxlength="500" placeholder="O que você gostaria de compartilhar?"></textarea>
        <label for="status-arquivo">Ou escolha uma foto/vídeo</label>
        <input id="status-arquivo" type="file" accept="image/*,video/*">
        <button id="publicar-status" type="button">Publicar status</button>
        <p id="status-aviso" role="status"></p>
      </div>
      <h3>Atualizações recentes</h3>
      <div id="lista-status" class="lista-status"></div>
    </section>

    <section class="conversa">
      <div class="barra-chat">
        <button
          id="voltar-chat"
          type="button"
          aria-label="Voltar aos contatos">←</button>

        <div class="avatar-chat" id="avatar-chat">M+</div>

        <div class="dados-chat">
          <div id="titulo-chat" class="titulo-chat">
            Selecione uma conversa
          </div>
          <div class="info-chat">Mensagens particulares</div>
        </div>
      </div>

      <div id="mensagens" class="mensagens" aria-live="polite"></div>

      <form id="form-enviar" class="enviar">
        <input
          id="texto"
          type="text"
          maxlength="3000"
          autocomplete="off"
          placeholder="Mensagem"
          disabled>

        <button
          id="botao-enviar"
          type="submit"
          aria-label="Enviar mensagem"
          disabled>➤</button>
      </form>

      <div id="aviso-chat" role="status"></div>
    </section>

  </section>
</div>

<!-- ARQUIVOS DO APLICATIVO -->
<script type="module" src="./app.js"></script>
<script type="module" src="./perfil.js"></script>
<script type="module" src="./notificacoes.js"></script>
<script type="module" src="./conversas-ui.js"></script>
<script src="./audio.js"></script>

<!-- NAVEGAÇÃO DA INTERFACE -->
<script>
(() => {
  const app = document.getElementById("app");
  const contatos = document.getElementById("contatos");
  const busca = document.getElementById("buscar-contato");
  const avatarChat = document.getElementById("avatar-chat");

  function iniciais(nome) {
    return (nome || "M+")
      .trim()
      .split(/\s+/)
      .slice(0, 2)
      .map(p => p.charAt(0))
      .join("")
      .toUpperCase();
  }

  function organizar() {
    contatos.querySelectorAll(".contato").forEach(item => {
      if (item.dataset.estilizado === "1") return;

      const nome = item.textContent.trim();

      item.dataset.estilizado = "1";
      item.dataset.nome = nome.toLowerCase();

      const avatar = document.createElement("div");
      avatar.className = "avatar";
      avatar.textContent = iniciais(nome);

      const info = document.createElement("div");
      info.className = "contato-info";

      const topo = document.createElement("div");
      topo.className = "contato-topo";

      const titulo = document.createElement("div");
      titulo.className = "contato-nome";
      titulo.textContent = nome;

      const descricao = document.createElement("div");
      descricao.className = "contato-sub";
      descricao.textContent = "Nenhuma mensagem ainda";

      topo.append(titulo);
      info.append(topo, descricao);
      item.replaceChildren(avatar, info);
    });

    filtrar();
  }

  function filtrar() {
    const texto = busca.value.toLowerCase().trim();

    contatos.querySelectorAll(".contato").forEach(item => {
      const nome = item.dataset.nome || "";
      item.style.display = nome.includes(texto) ? "" : "none";
    });
  }

  const observador = new MutationObserver(organizar);
  observador.observe(contatos, { childList: true });

  organizar();
  busca.addEventListener("input", filtrar);

  document.getElementById("novo-contato").onclick = () => busca.focus();

  contatos.addEventListener("click", evento => {
    const item = evento.target.closest(".contato");
    if (!item) return;

    const nome =
      item.querySelector(".contato-nome")?.textContent || "Contato";

    avatarChat.textContent = iniciais(nome);
    app.classList.add("chat-aberto");
  });

  contatos.addEventListener("keydown", evento => {
    if (evento.key === "Enter" && evento.target.closest(".contato")) {
      app.classList.add("chat-aberto");
    }
  });

  document.getElementById("voltar-chat").onclick = () => {
    app.classList.remove("chat-aberto");
  };

  const navMensagens = document.getElementById("nav-conversas");
  const navStatus = document.getElementById("nav-status");
  const telaStatus = document.getElementById("tela-status");
  const listaStatus = document.getElementById("lista-status");
  const statusTexto = document.getElementById("status-texto");
  const statusArquivo = document.getElementById("status-arquivo");
  const statusAviso = document.getElementById("status-aviso");

  function lerStatus() {
    try {
      const agora = Date.now();
      const itens = JSON.parse(localStorage.getItem("mensagensPlusStatusLocal") || "[]")
        .filter(item => agora - item.criadoEm < 24 * 60 * 60 * 1000);
      localStorage.setItem("mensagensPlusStatusLocal", JSON.stringify(itens));
      return itens;
    } catch (_) { return []; }
  }

  function renderizarStatus() {
    const itens = lerStatus();
    listaStatus.replaceChildren();
    if (!itens.length) {
      const vazio = document.createElement("p");
      vazio.className = "status-vazio";
      vazio.textContent = "Ainda não há status publicados neste aparelho.";
      listaStatus.append(vazio);
      return;
    }
    itens.slice().reverse().forEach(item => {
      const linha = document.createElement("div");
      linha.className = "status-item";
      const mini = document.createElement("div");
      mini.className = "status-miniatura";
      if (item.tipo === "texto") {
        mini.textContent = "T";
      } else if (item.tipo === "imagem") {
        const img = document.createElement("img");
        img.src = item.conteudo;
        img.alt = "Foto do status";
        mini.append(img);
      } else {
        mini.textContent = "▶";
      }
      const conteudo = document.createElement("div");
      conteudo.className = "status-conteudo";
      const texto = document.createElement("div");
      texto.textContent = item.texto || (item.tipo === "video" ? "Status em vídeo" : "Status com foto");
      const hora = document.createElement("div");
      hora.className = "status-hora";
      hora.textContent = "Publicado agora · desaparece em até 24 horas";
      conteudo.append(texto, hora);
      linha.append(mini, conteudo);
      if (item.tipo === "video") {
        linha.title = "Vídeo selecionado; a prévia será exibida quando a integração de mídia estiver concluída.";
      }
      listaStatus.append(linha);
    });
  }

  navStatus.onclick = () => {
    app.classList.remove("chat-aberto");
    app.classList.add("mostrando-status");
    navStatus.classList.add("ativo");
    navMensagens.classList.remove("ativo");
    renderizarStatus();
  };

  navMensagens.onclick = () => {
    app.classList.remove("mostrando-status", "chat-aberto");
    navMensagens.classList.add("ativo");
    navStatus.classList.remove("ativo");
  };

  document.getElementById("publicar-status").onclick = () => {
    const texto = statusTexto.value.trim();
    const arquivo = statusArquivo.files && statusArquivo.files[0];
    if (!texto && !arquivo) {
      statusAviso.textContent = "Escreva um texto ou selecione uma foto/vídeo.";
      return;
    }
    if (arquivo && arquivo.size > 3 * 1024 * 1024) {
      statusAviso.textContent = "Escolha um arquivo de até 3 MB nesta versão de interface.";
      return;
    }
    const salvar = conteudo => {
      const itens = lerStatus();
      itens.push({
        id: String(Date.now()),
        tipo: arquivo ? (arquivo.type.startsWith("video/") ? "video" : "imagem") : "texto",
        texto,
        conteudo: conteudo || "",
        criadoEm: Date.now()
      });
      try {
        localStorage.setItem("mensagensPlusStatusLocal", JSON.stringify(itens));
        statusTexto.value = "";
        statusArquivo.value = "";
        statusAviso.textContent = "Status publicado neste aparelho. A sincronização entre contas precisa ser ligada ao Firebase.";
        renderizarStatus();
      } catch (_) {
        statusAviso.textContent = "Não foi possível guardar este status. Tente uma foto menor ou apenas texto.";
      }
    };
    if (!arquivo) { salvar(""); return; }
    const reader = new FileReader();
    reader.onload = () => salvar(String(reader.result || ""));
    reader.onerror = () => { statusAviso.textContent = "Não foi possível ler esse arquivo."; };
    reader.readAsDataURL(arquivo);
  };

  document.getElementById("voltar-chat").onclick = () => {
    app.classList.remove("chat-aberto");
  };

  new MutationObserver(() => {
    if (app.classList.contains("oculto")) {
      app.classList.remove("chat-aberto");
    }
  }).observe(app, {
    attributes: true,
    attributeFilter: ["class"]
  });
})();
</script>

</body>
</html>
