
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#075e54">
  <title>Mensagens Plus</title>

  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f0f2f5;
      color: #111b21;
      font-family: Arial, sans-serif;
    }
    button, input { font: inherit; }
    button { cursor: pointer; }
    .topbar {
      background: #075e54;
      color: white;
      padding: 16px;
      font-size: 21px;
      font-weight: bold;
    }
    .subtitle {
      padding: 7px 16px;
      background: white;
      color: #667781;
      font-size: 13px;
    }
    .tabs {
      display: flex;
      background: white;
      border-bottom: 1px solid #ddd;
    }
    .tabs button {
      width: 50%;
      padding: 15px 5px;
      border: 0;
      background: white;
      color: #667781;
      font-weight: bold;
    }
    .tabs button.active {
      color: #008f78;
      border-bottom: 3px solid #008f78;
    }
    .page { display: none; padding: 14px; }
    .page.active { display: block; }
    .panel {
      background: white;
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }
    .panel h3 { margin: 0 0 12px; }
    .field {
      display: block;
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      border: 1px solid #ccd2d5;
      border-radius: 9px;
      background: white;
    }
    .btn {
      border: 0;
      border-radius: 9px;
      background: #087f6e;
      color: white;
      padding: 12px 16px;
      font-weight: bold;
    }
    .btn.secondary { background: #e5f3ef; color: #075e54; }
    .btn.danger { background: #b3261e; }
    .status-list {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .status-card {
      height: 235px;
      position: relative;
      overflow: hidden;
      border-radius: 14px;
      background: linear-gradient(145deg,#075e54,#172c3d);
      color: white;
      border: 0;
      text-align: left;
      padding: 0;
    }
    .status-card img, .status-card video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .status-card .card-caption {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 35px 10px 12px;
      background: linear-gradient(transparent,rgba(0,0,0,.8));
      overflow-wrap: anywhere;
    }
    .empty {
      color: #667781;
      text-align: center;
      padding: 24px 8px;
      grid-column: 1 / -1;
    }
    .viewer {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 1000;
      background: #050505;
      color: white;
      overflow: hidden;
    }
    .viewer.open { display: block; }
    .viewer-media {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: contain;
      background: #050505;
    }
    .viewer-text {
      position: absolute;
      inset: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 34px;
      text-align: center;
      font-size: 30px;
      font-weight: bold;
      white-space: pre-wrap;
      overflow-wrap: anywhere;
    }
    .viewer-top {
      position: absolute;
      z-index: 3;
      top: 0;
      left: 0;
      right: 0;
      padding: 18px 14px;
      background: linear-gradient(#0009,transparent);
    }
    .progress-bg {
      height: 3px;
      background: #ffffff66;
      margin-bottom: 14px;
      border-radius: 3px;
    }
    .progress-bar {
      width: 100%;
      height: 3px;
      background: white;
      transform-origin: left;
    }
    .viewer-name {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .viewer-bottom {
      position: absolute;
      z-index: 4;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      justify-content: space-between;
      padding: 20px;
      background: linear-gradient(transparent,#0009);
    }
    .viewer-btn {
      border: 1px solid #ffffff88;
      border-radius: 50px;
      padding: 12px 17px;
      color: white;
      background: #2228;
    }
    .tap-zones {
      position: absolute;
      inset: 70px 0 70px;
      display: flex;
      z-index: 2;
    }
    .tap-zones button {
      flex: 1;
      border: 0;
      background: transparent;
    }
    .login-box {
      max-width: 460px;
      margin: 20px auto;
    }
    .muted { color: #667781; font-size: 13px; }
    @media (min-width: 600px) {
      .status-list { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .page { max-width: 850px; margin: auto; }
    }
  </style>
</head>
<body>

  <header class="topbar">Mensagens Plus</header>
  <div class="subtitle">Parceira Vem Comigo Deus</div>

  <nav class="tabs">
    <button id="tabMessages" class="active" onclick="showPage('messages')">
      MENSAGENS
    </button>
    <button id="tabStatus" onclick="showPage('status')">
      STATUS
    </button>
  </nav>

  <main>
    <section id="messagesPage" class="page active">
      <div class="panel">
        <h3>Mensagens privadas</h3>
        <p class="muted">
          A área de conversas depende da integração com os arquivos originais do aplicativo.
        </p>
        <div id="conversas"></div>
        <div id="listaConversas"></div>
      </div>
    </section>

    <section id="statusPage" class="page">
      <div class="panel">
        <h3>Meu Status</h3>
        <p class="muted">Compartilhe uma foto, vídeo ou mensagem por até 24 horas.</p>

        <input id="statusText" class="field"
          placeholder="Escreva uma atualização de status...">

        <label for="statusFile">Escolher foto ou vídeo</label>
        <input id="statusFile" class="field" type="file"
          accept="image/*,video/*">

        <button class="btn" onclick="publishStatus()">Publicar Status</button>
        <p id="statusFeedback" class="muted"></p>
      </div>

      <div class="panel">
        <h3>Atualizações recentes</h3>
        <div id="statusList" class="status-list"></div>
      </div>
    </section>
  </main>

  <div id="statusViewer" class="viewer" aria-hidden="true">
    <div class="viewer-top">
      <div class="progress-bg">
        <div id="progressBar" class="progress-bar"></div>
      </div>
      <div class="viewer-name">
        <strong id="viewerTitle">Status</strong>
        <button class="viewer-btn" onclick="closeViewer()">✕ Fechar</button>
      </div>
    </div>

    <div id="viewerContent"></div>

    <div class="tap-zones">
      <button aria-label="Status anterior" onclick="previousStatus()"></button>
      <button aria-label="Próximo status" onclick="nextStatus()"></button>
    </div>

    <div class="viewer-bottom">
      <button class="viewer-btn" onclick="previousStatus()">‹ Anterior</button>
      <button class="viewer-btn" onclick="nextStatus()">Próximo ›</button>
    </div>
  </div>

  <script>
    "use strict";

    const STORAGE_KEY = "mensagensPlusStatusLocal";
    const MAX_FILE_SIZE = 3 * 1024 * 1024;
    const STATUS_LIFETIME = 24 * 60 * 60 * 1000;

    let statuses = [];
    let currentIndex = 0;
    let viewerTimer = null;
    let progressTimer = null;
    let currentObjectUrl = null;

    function showPage(page) {
      const messages = page === "messages";
      document.getElementById("messagesPage").classList.toggle("active", messages);
      document.getElementById("statusPage").classList.toggle("active", !messages);
      document.getElementById("tabMessages").classList.toggle("active", messages);
      document.getElementById("tabStatus").classList.toggle("active", !messages);
      if (!messages) renderStatuses();
    }

    function loadStatuses() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        statuses = Array.isArray(saved) ? saved.filter(item =>
          item && item.createdAt &&
          Date.now() - item.createdAt < STATUS_LIFETIME
        ) : [];
        localStorage.setItem(STORAGE_KEY, JSON.stringify(statuses));
      } catch (error) {
        statuses = [];
      }
    }

    async function publishStatus() {
      const text = document.getElementById("statusText").value.trim();
      const input = document.getElementById("statusFile");
      const file = input.files && input.files[0];
      const feedback = document.getElementById("statusFeedback");

      if (!text && !file) {
        feedback.textContent = "Escreva uma mensagem ou escolha uma foto/vídeo.";
        return;
      }

      if (file && file.size > MAX_FILE_SIZE) {
        feedback.textContent = "O arquivo deve ter no máximo 3 MB.";
        return;
      }

      if (file && !/^image\/|^video\//.test(file.type)) {
        feedback.textContent = "Escolha uma foto ou vídeo válido.";
        return;
      }

      const status = {
        id: Date.now().toString() + Math.random().toString(36).slice(2),
        text,
        createdAt: Date.now(),
        mediaType: file ? file.type : "",
        mediaName: file ? file.name : "",
        mediaData: file ? await readFileAsDataURL(file) : ""
      };

      statuses.unshift(status);

      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(statuses));
      } catch (error) {
        statuses.shift();
        feedback.textContent =
          "Não há espaço suficiente no armazenamento deste aparelho.";
        return;
      }

      document.getElementById("statusText").value = "";
      input.value = "";
      feedback.textContent = "Status publicado neste aparelho!";
      renderStatuses();
    }

    function readFileAsDataURL(file) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => resolve(reader.result);
        reader.onerror = () => reject(new Error("Não foi possível ler o arquivo."));
        reader.readAsDataURL(file);
      });
    }

    function renderStatuses() {
      const list = document.getElementById("statusList");
      list.replaceChildren();

      if (!statuses.length) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "Nenhum Status ainda. Publique o primeiro!";
        list.appendChild(empty);
        return;
      }

      statuses.forEach((status, index) => {
        const card = document.createElement("button");
        card.className = "status-card";
        card.type = "button";
        card.onclick = () => openViewer(index);

        if (status.mediaData && status.mediaType.startsWith("image/")) {
          const img = document.createElement("img");
          img.src = status.mediaData;
          img.alt = status.text || "Foto do Status";
          card.appendChild(img);
        } else if (status.mediaData && status.mediaType.startsWith("video/")) {
          const video = document.createElement("video");
          video.src = status.mediaData;
          video.muted = true;
          video.playsInline = true;
          card.appendChild(video);
        }

        const caption = document.createElement("div");
        caption.className = "card-caption";
        caption.textContent = status.text || "📷 Status";
        card.appendChild(caption);
        list.appendChild(card);
      });
    }

    function openViewer(index) {
      if (!statuses.length) return;
      currentIndex = index;
      const viewer = document.getElementById("statusViewer");
      viewer.classList.add("open");
      viewer.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      showCurrentStatus();
    }

    function showCurrentStatus() {
      clearTimeout(viewerTimer);
      clearInterval(progressTimer);

      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }

      const status = statuses[currentIndex];
      if (!status) {
        closeViewer();
        return;
      }

      document.getElementById("viewerTitle").textContent =
        "Meu Status · " + new Date(status.createdAt).toLocaleTimeString("pt-BR", {
          hour: "2-digit", minute: "2-digit"
        });

      const content = document.getElementById("viewerContent");
      content.replaceChildren();

      if (status.mediaData && status.mediaType.startsWith("image/")) {
        const img = document.createElement("img");
        img.className = "viewer-media";
        img.src = status.mediaData;
        img.alt = status.text || "Foto do Status";
        content.appendChild(img);
      } else if (status.mediaData && status.mediaType.startsWith("video/")) {
        const video = document.createElement("video");
        video.className = "viewer-media";
        video.src = status.mediaData;
        video.controls = true;
        video.autoplay = true;
        video.playsInline = true;
        content.appendChild(video);
      }

      if (status.text) {
        const caption = document.createElement("div");
        caption.className = "viewer-text";
        caption.textContent = status.text;
        if (status.mediaData) {
          caption.style.inset = "auto 0 60px";
          caption.style.fontSize = "21px";
          caption.style.maxHeight = "40%";
          caption.style.background = "linear-gradient(transparent,#0009)";
        }
        content.appendChild(caption);
      }

      const bar = document.getElementById("progressBar");
      bar.style.transition = "none";
      bar.style.transform = "scaleX(0)";
      let elapsed = 0;
      const duration = 7000;

      progressTimer = setInterval(() => {
        elapsed += 100;
        bar.style.transition = "none";
        bar.style.transform = "scaleX(" + Math.min(1, elapsed / duration) + ")";
        if (elapsed >= duration) clearInterval(progressTimer);
      }, 100);

      viewerTimer = setTimeout(nextStatus, duration);
    }

    function nextStatus() {
      if (currentIndex < statuses.length - 1) {
        currentIndex++;
        showCurrentStatus();
      } else {
        closeViewer();
      }
    }

    function previousStatus() {
      if (currentIndex > 0) {
        currentIndex--;
        showCurrentStatus();
      } else {
        showCurrentStatus();
      }
    }

    function closeViewer() {
      clearTimeout(viewerTimer);
      clearInterval(progressTimer);
      document.getElementById("statusViewer").classList.remove("open");
      document.getElementById("statusViewer").setAttribute("aria-hidden", "true");
      document.getElementById("viewerContent").replaceChildren();
      document.body.style.overflow = "";

      if (currentObjectUrl) {
        URL.revokeObjectURL(currentObjectUrl);
        currentObjectUrl = null;
      }
    }

    // Navegação por gestos horizontais no visualizador.
    let touchStartX = 0;
    let touchStartY = 0;

    document.getElementById("statusViewer").addEventListener("touchstart", event => {
      if (!event.changedTouches.length) return;
      touchStartX = event.changedTouches[0].clientX;
      touchStartY = event.changedTouches[0].clientY;
    }, { passive: true });

    document.getElementById("statusViewer").addEventListener("touchend", event => {
      if (!event.changedTouches.length) return;
      const dx = event.changedTouches[0].clientX - touchStartX;
      const dy = event.changedTouches[0].clientY - touchStartY;

      if (Math.abs(dx) > 70 && Math.abs(dx) > Math.abs(dy)) {
        if (dx < 0) nextStatus();
        else previousStatus();
      } else if (dy > 100) {
        closeViewer();
      }
    }, { passive: true });

    document.addEventListener("keydown", event => {
      if (event.key === "Escape") closeViewer();
      if (event.key === "ArrowRight") nextStatus();
      if (event.key === "ArrowLeft") previousStatus();
    });

    loadStatuses();
    renderStatuses();
  </script>

  <!--
    IMPORTANTE:
    Este modelo não substitui automaticamente a autenticação Firebase
    nem a lógica original de conversas. Para manter essas funções,
    integre aqui os scripts do index.html original.
    Os Status deste exemplo ficam apenas neste aparelho; não são
    sincronizados com outros celulares e podem ocupar armazenamento.
  -->

  <script type="module" src="./app.js"></script>
  <script type="module" src="./perfil.js"></script>
  <script type="module" src="./notificacoes.js"></script>
  <script type="module" src="./conversas-ui.js"></script>
  <script type="module" src="./audio.js"></script>

</body>
</html>
